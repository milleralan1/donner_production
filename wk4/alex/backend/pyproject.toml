[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alex-database",
    "langfuse>=3.3.4",
    "openai-agents>=0.3.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
gcp = ["alex-database[gcp]"]

[tool.uv.workspace]
members = [
    "database",
    "api",
    "scheduler",
]

[tool.uv.sources]
alex-database = { workspace = true }
