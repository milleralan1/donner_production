[project]
name = "alex-database"
version = "0.1.0"
description = "Cloud SQL PostgreSQL database package for Alex Financial Planner"
requires-python = ">=3.12"
dependencies = [
    "cloud-sql-python-connector[pg8000]>=1.18.2",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
gcp = [
    "cloud-sql-python-connector[pg8000]>=1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
